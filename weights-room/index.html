<title>The Weights Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a training notebook. One reading column for lessons, a wide
   bench for the lab. Teal means "positive / yes / class 1", rust means
   "negative / no / class 0", everywhere on the page. */
:root {
  --bg: #F1F3EF;
  --surface: #FFFFFF;
  --sunken: #E6EAE5;
  --ink: #16201E;
  --muted: #55625E;
  --line: #D2D9D4;
  --pos: #0C7A6A;
  --neg: #C2491A;
  --mark: #F2D257;
  --mark-ink: #2E2600;
  --pos-soft: rgba(12, 122, 106, 0.12);
  --neg-soft: rgba(194, 73, 26, 0.12);
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1413; --surface: #151D1B; --sunken: #1C2624; --ink: #E3EAE7; --muted: #98A6A1; --line: #2A3633;
    --pos: #3BC2AB; --neg: #F0804F; --mark: #E6C64A; --mark-ink: #241D00;
    --pos-soft: rgba(59, 194, 171, 0.14); --neg-soft: rgba(240, 128, 79, 0.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1413; --surface: #151D1B; --sunken: #1C2624; --ink: #E3EAE7; --muted: #98A6A1; --line: #2A3633;
  --pos: #3BC2AB; --neg: #F0804F; --mark: #E6C64A; --mark-ink: #241D00;
  --pos-soft: rgba(59, 194, 171, 0.14); --neg-soft: rgba(240, 128, 79, 0.14);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface);
}
a { color: var(--pos); text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pos); outline-offset: 2px; }
.mono, code { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--sunken); padding: 0.1em 0.35em; border-radius: 4px; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner {
  max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 12px 20px;
  flex-wrap: wrap; padding-block: 10px;
}
.brand {
  font-family: var(--display); font-weight: 850; font-stretch: 78%; font-size: 1.35rem;
  letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink); text-decoration: none;
  display: flex; align-items: center; gap: 10px; margin-right: auto;
}
.brand-mark { width: 26px; height: 26px; flex: none; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a {
  color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500;
  padding: 6px 10px; border-radius: 6px;
}
.nav a:hover { color: var(--ink); background: var(--sunken); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunken); }

/* ---------- page frame ---------- */
.page {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 1120px; margin: 0 auto; }
.read { max-width: 700px; margin: 0 auto; }

h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 850; font-stretch: 80%; letter-spacing: -0.005em; }
h2 { font-size: clamp(1.4rem, 3.6vw, 1.9rem); font-weight: 800; font-stretch: 85%; }
h3 { font-size: 1.15rem; font-weight: 750; font-stretch: 90%; }
.eyebrow {
  font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.lede { font-size: 1.15rem; color: var(--muted); max-width: 62ch; }
.prose p, .prose ul, .prose ol { margin: 0 0 1em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin-bottom: 0.35em; }
.prose h3 { margin: 1.6em 0 0.5em; }
.prose strong { font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 0.95rem; line-height: 1.3;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--pos); border-color: var(--pos); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: 0.85rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 12px 36px; }
.hero h1 { margin: 10px 0 16px; }
.hero-figure { display: grid; gap: 8px; justify-items: center; }
.hero-figure canvas { width: 100%; max-width: 380px; aspect-ratio: 1; border-radius: var(--radius); border: 1px solid var(--line); }
.hero-caption { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.progress-line { font-size: 0.95rem; color: var(--muted); margin-top: 18px; }

.parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; margin-top: 12px; }
.part h2 { margin: 6px 0 14px; }
.lesson-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lesson-list li { border-bottom: 1px solid var(--line); }
.lesson-list a {
  display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 12px; align-items: baseline;
  padding: 12px 4px; text-decoration: none; color: var(--ink);
}
.lesson-list a:hover { background: var(--surface); }
.lesson-num { font-family: var(--mono); color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.lesson-title { font-weight: 600; }
.lesson-sub { display: block; color: var(--muted); font-size: 0.9rem; font-weight: 400; }
.chip {
  font-family: var(--mono); font-size: 0.72rem; padding: 2px 8px; border-radius: 99px; white-space: nowrap;
  border: 1px solid var(--line); color: var(--muted);
}
.chip.done { background: var(--pos-soft); border-color: transparent; color: var(--pos); }
.extras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 40px; }
.extra {
  display: grid; gap: 6px; align-content: start; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink); text-decoration: none;
}
.extra:hover { border-color: var(--muted); }
.extra p { margin: 0; color: var(--muted); font-size: 0.92rem; }

/* ---------- lesson ---------- */
.lesson-head { margin-bottom: 24px; }
.lesson-head h1 { font-size: clamp(1.9rem, 5.5vw, 2.8rem); margin-top: 8px; }
.meetup {
  margin: 28px 0; padding: 18px 20px; border-radius: var(--radius);
  background: color-mix(in srgb, var(--mark) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--mark) 60%, var(--line));
}
.meetup .tag {
  display: inline-block; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--mark); color: var(--mark-ink); padding: 2px 8px; border-radius: 4px; margin-bottom: 8px;
}
.meetup p { margin: 0; font-size: 1.05rem; }
.widget {
  margin: 24px 0; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
.widget-title { font-family: var(--display); font-weight: 750; font-stretch: 90%; font-size: 1.05rem; margin-bottom: 4px; }
.widget-note { color: var(--muted); font-size: 0.88rem; margin: 0 0 12px; }
.illustration-note { font-size: 0.82rem; color: var(--muted); font-style: italic; margin-top: 10px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.slider-row { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) 3.6em; gap: 10px; align-items: center; margin: 6px 0; }
.slider-row label { font-family: var(--mono); font-size: 0.88rem; }
.slider-row output { font-family: var(--mono); font-size: 0.88rem; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--pos); }
.readout {
  font-family: var(--mono); font-size: 0.86rem; background: var(--sunken); border-radius: 8px; padding: 10px 12px;
  overflow-x: auto; white-space: pre; line-height: 1.7; font-variant-numeric: tabular-nums;
}
.big-number { font-family: var(--display); font-weight: 850; font-stretch: 80%; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 0.88rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
canvas.plot { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; border: 1px solid var(--line); touch-action: manipulation; }
canvas.wide { width: 100%; display: block; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
.lesson-nav a { max-width: 48%; }
.lesson-nav .next { margin-left: auto; text-align: right; }
.lesson-nav small { display: block; color: var(--muted); font-size: 0.78rem; }
.callout { padding: 14px 16px; border: 1px dashed var(--line); border-radius: var(--radius); margin: 18px 0; font-size: 0.95rem; }
.formula {
  font-family: var(--mono); font-size: 1rem; text-align: center; padding: 14px; margin: 16px 0;
  background: var(--sunken); border-radius: 8px; overflow-x: auto;
}
.table-scroll { overflow-x: auto; margin: 0 0 1em; }
table.data { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
table.data th, table.data td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data th { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
table.data td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- quiz ---------- */
.quiz { margin-top: 36px; border-top: 2px solid var(--ink); padding-top: 18px; }
.quiz h2 { margin-bottom: 4px; }
.q { padding: 16px 0; border-bottom: 1px solid var(--line); }
.q-prompt { font-weight: 600; margin-bottom: 10px; }
.q-options { display: grid; gap: 8px; }
.q-opt {
  text-align: left; cursor: pointer; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; line-height: 1.45;
}
.q-opt:hover:not([disabled]) { border-color: var(--muted); }
.q-opt .letter { font-family: var(--mono); color: var(--muted); }
.q-opt[disabled] { cursor: default; }
.q-opt.right { border-color: var(--pos); background: var(--pos-soft); }
.q-opt.wrong { border-color: var(--neg); background: var(--neg-soft); }
.q-why { margin-top: 10px; font-size: 0.93rem; padding: 10px 12px; border-radius: 8px; background: var(--sunken); }
.q-why b.pos, .q-why b.neg { font-weight: 600; }
.quiz-score { margin-top: 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

/* ---------- lab ---------- */
.lab-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 18px; }
.lab-head h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding: 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px;
}
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.field select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.field input[type="range"] { width: 120px; }
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.panel h3 { margin-bottom: 8px; }
.arch { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; font-size: 0.88rem; }
.stepper { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 0.85rem; }
.stepper button {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1; padding: 0;
}
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.stat { display: grid; gap: 2px; }
.stat span { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stat b { font-family: var(--mono); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; align-items: center; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.ring { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); vertical-align: -1px; margin-right: 4px; }
.neuron-info { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); min-height: 1.5em; margin-top: 6px; overflow-x: auto; white-space: nowrap; }
.hint-line { font-size: 0.9rem; color: var(--muted); margin-top: 8px; }

/* ---------- tokens / attention / LM ---------- */
.tokens { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }
.tok {
  font-family: var(--mono); font-size: 0.9rem; padding: 3px 6px; border-radius: 5px; display: inline-grid; justify-items: center; line-height: 1.25;
}
.tok small { font-size: 0.65rem; opacity: 0.75; }
.tok:nth-child(4n+1) { background: var(--pos-soft); }
.tok:nth-child(4n+2) { background: var(--neg-soft); }
.tok:nth-child(4n+3) { background: color-mix(in srgb, var(--mark) 35%, transparent); }
.tok:nth-child(4n+4) { background: var(--sunken); }
.merge-list { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); max-height: 9.5em; overflow: auto; background: var(--sunken); border-radius: 8px; padding: 8px 10px; }
textarea, input[type="text"] {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); font: inherit; color: var(--ink);
}
.bars { display: grid; gap: 4px; margin-top: 8px; }
.bar { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 3.6em; gap: 8px; align-items: center; font-family: var(--mono); font-size: 0.85rem; }
.bar-track { height: 14px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--pos); }
.bar .p { text-align: right; font-variant-numeric: tabular-nums; }
.sample {
  font-family: var(--mono); font-size: 0.9rem; background: var(--sunken); border-radius: 8px; padding: 10px 12px; min-height: 3.4em;
  overflow-wrap: anywhere;
}
.sample .prompt { color: var(--muted); }
.att-sentence { display: flex; flex-wrap: wrap; gap: 6px 4px; margin: 12px 0; }
.att-word { display: grid; justify-items: center; gap: 3px; }
.att-word button, .att-word span.w {
  font-family: var(--mono); font-size: 0.92rem; padding: 4px 7px; border-radius: 6px; border: 1px solid transparent; background: none;
}
.att-word button { border-color: var(--pos); cursor: pointer; }
.att-word button[aria-pressed="true"] { background: var(--pos); color: var(--surface); }
.att-bar { width: 100%; height: 6px; border-radius: 3px; background: var(--pos); }
.att-pct { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }

/* ---------- cheat sheet / code ---------- */
.qa { display: grid; gap: 14px; margin: 18px 0 32px; }
.qa details { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 0 16px; }
.qa summary { cursor: pointer; padding: 14px 0; font-weight: 600; }
.qa details p { margin: 0 0 14px; }
.glossary { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line); margin-top: 12px; }
.glossary dt, .glossary dd { margin: 0; padding: 9px 0; border-bottom: 1px solid var(--line); }
.glossary dt { font-weight: 600; padding-right: 12px; }
.code-view {
  font-family: var(--mono); font-size: 0.8rem; line-height: 1.55; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px; overflow: auto; max-height: 75vh; white-space: pre; tab-size: 2;
}
.code-view .c { color: var(--muted); }

@media (max-width: 860px) {
  .hero, .parts, .lab-grid { grid-template-columns: minmax(0, 1fr); }
  .hero-figure { order: -1; }
  .hero-figure canvas { max-width: 280px; }
  .extras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .two-col { grid-template-columns: minmax(0, 1fr); }
  .extras { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .glossary { grid-template-columns: minmax(0, 1fr); }
  .glossary dt { border-bottom: 0; padding-bottom: 0; }
  .brand { font-size: 1.15rem; }
  .nav a { padding: 5px 8px; font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#home">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
        <line x1="5" y1="7" x2="13" y2="13" stroke="var(--pos)" stroke-width="2.4"/>
        <line x1="5" y1="19" x2="13" y2="13" stroke="var(--neg)" stroke-width="1.4"/>
        <line x1="13" y1="13" x2="21" y2="13" stroke="var(--pos)" stroke-width="3"/>
        <circle cx="5" cy="7" r="3" fill="var(--ink)"/><circle cx="5" cy="19" r="3" fill="var(--ink)"/>
        <circle cx="13" cy="13" r="3.4" fill="var(--ink)"/><circle cx="21" cy="13" r="3.4" fill="var(--ink)"/>

    <nav class="nav" aria-label="Main">
      <a href="#home" data-nav="home">Course</a>

  </div>
</header>

<script>
"use strict";

// =====================================================================
//  Small helpers
// =====================================================================
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const fmt = (n, d = 2) => (Object.is(Math.round(n * 10 ** d), -0) ? 0 : n).toFixed(d);
const signed = (n, d = 2) => (n < 0 ? "(" + fmt(n, d) + ")" : fmt(n, d));
const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let viewToken = 0; // bumps on every navigation so old animation loops stop

function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key) || "null");
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) { return null; }
}
function progress() { return store("weights-room-progress") || { lessons: {}, finalBest: null }; }
function saveProgress(p) { store("weights-room-progress", p); }

function hexToRgb(hex) {
  hex = hex.trim().replace("#", "");
  if (hex.length === 3) hex = hex.split("").map((c) => c + c).join("");
  const n = parseInt(hex, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function colors() {
  const cs = getComputedStyle(document.documentElement);
  const get = (name) => cs.getPropertyValue(name).trim();
  return {
    pos: hexToRgb(get("--pos")), neg: hexToRgb(get("--neg")), surface: hexToRgb(get("--surface")),
    ink: get("--ink"), muted: get("--muted"), line: get("--line"), posHex: get("--pos"), negHex: get("--neg"),
    surfaceHex: get("--surface"), sunken: get("--sunken"),
  };
}
// value from -1 (rust) through 0 (paper) to +1 (teal)
function valueColor(v, C, strength = 0.8) {
  const t = Math.min(1, Math.abs(v)) * strength;
  const target = v >= 0 ? C.pos : C.neg;
  return [0, 1, 2].map((k) => Math.round(C.surface[k] + (target[k] - C.surface[k]) * t));
}

// Size a canvas for crisp drawing; returns {ctx, w, h} in CSS pixels.
function setupCanvas(canvas, cssHeight) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 300;
  const h = cssHeight || canvas.clientHeight || w;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

const DOMAIN = 1.15; // the 2D board runs from -1.15 to 1.15
const toPx = (v, size) => ((v + DOMAIN) / (2 * DOMAIN)) * size;
const fromPx = (px, size) => (px / size) * 2 * DOMAIN - DOMAIN;

// Shade the board by the network's answer, then draw the points.
function drawBoundary(canvas, predict, points, opts = {}) {
  const { ctx, w } = setupCanvas(canvas);
  const C = colors();
  const N = opts.res || 48;
  const off = document.createElement("canvas");
  off.width = N; off.height = N;
  const octx = off.getContext("2d");
  const img = octx.createImageData(N, N);
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const x = -DOMAIN + (2 * DOMAIN * (i + 0.5)) / N;
      const y = DOMAIN - (2 * DOMAIN * (j + 0.5)) / N;
      const p = predict([x, y]);
      const c = valueColor(2 * p - 1, C, 0.55);
      const o = (j * N + i) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, w, w);
  // axes
  ctx.strokeStyle = C.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(toPx(0, w), 0); ctx.lineTo(toPx(0, w), w); ctx.moveTo(0, toPx(0, w)); ctx.lineTo(w, toPx(0, w)); ctx.stroke();
  // points
  const r = opts.radius || Math.max(3, w / 95);
  for (const pt of points) {
    const px = toPx(pt.x[0], w), py = w - toPx(pt.x[1], w);
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
    const col = pt.y ? C.posHex : C.negHex;
    if (pt.test) {
      ctx.fillStyle = C.surfaceHex; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
    } else {
      ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = C.surfaceHex; ctx.stroke();
    }
  }
  if (opts.marker) {
    const mx = toPx(opts.marker[0], w), my = w - toPx(opts.marker[1], w);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx, my, 8, 0, Math.PI * 2); ctx.moveTo(mx - 13, my); ctx.lineTo(mx - 4, my); ctx.moveTo(mx + 4, my); ctx.lineTo(mx + 13, my);
    ctx.moveTo(mx, my - 13); ctx.lineTo(mx, my - 4); ctx.moveTo(mx, my + 4); ctx.lineTo(mx, my + 13); ctx.stroke();
  }
}

// Simple line chart for loss over time.
function drawLossChart(canvas, series, opts = {}) {
  const { ctx, w, h } = setupCanvas(canvas, opts.height || 110);
  const C = colors();
  ctx.clearRect(0, 0, w, h);
  const padL = 36, padB = 18, padT = 8, padR = 8;
  const all = series.flatMap((s) => s.data);
  const maxY = opts.maxY || Math.max(0.1, ...all.filter(Number.isFinite)) * 1.05;
  const n = Math.max(2, ...series.map((s) => s.data.length));
  const X = (i) => padL + (i / (n - 1)) * (w - padL - padR);
  const Y = (v) => padT + (1 - Math.min(v, maxY) / maxY) * (h - padT - padB);
  ctx.font = "11px " + getComputedStyle(document.body).getPropertyValue("--mono");
  ctx.fillStyle = C.muted; ctx.strokeStyle = C.line; ctx.lineWidth = 1;
  for (const frac of [0, 0.5, 1]) {
    const v = maxY * frac;
    ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke();
    ctx.fillText(v.toFixed(v >= 10 ? 0 : 2), 2, Y(v) + 4);
  }
  ctx.fillText(opts.xLabel || "", padL, h - 3);
  for (const s of series) {
    if (s.data.length < 2) continue;
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.setLineDash(s.dash || []);
    ctx.beginPath();
    s.data.forEach((v, i) => (i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v))));
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

// =====================================================================
//  Quiz engine
// =====================================================================
function renderQuiz(container, questions, { title = "Check yourself", onFinish } = {}) {
  let answered = 0, correct = 0;
  container.innerHTML = `<div class="quiz"><h2>${title}</h2>
    <p class="muted" style="margin:0">Tap an answer. You'll see why it's right or wrong straight away.</p>
    <div class="q-list"></div><div class="quiz-score" hidden></div></div>`;
  const list = $(".q-list", container);
  const scoreBox = $(".quiz-score", container);
  questions.forEach((q, qi) => {
    const div = document.createElement("div");
    div.className = "q";
    div.innerHTML = `<div class="q-prompt">${qi + 1}. ${q.q}</div><div class="q-options">${q.options
      .map((o, oi) => `<button class="q-opt" data-i="${oi}"><span class="letter">${"ABCD"[oi]}</span><span>${o}</span></button>`)
      .join("")}</div>`;
    list.appendChild(div);
    $$(".q-opt", div).forEach((btn) =>
      btn.addEventListener("click", () => {
        const chosen = +btn.dataset.i;
        const right = chosen === q.answer;
        $$(".q-opt", div).forEach((b) => {
          b.disabled = true;
          if (+b.dataset.i === q.answer) b.classList.add("right");
        });
        if (!right) btn.classList.add("wrong");
        const why = document.createElement("div");
        why.className = "q-why";
        why.innerHTML = (right ? '<b class="pos">Right.</b> ' : '<b class="neg">Not quite.</b> ') + q.why;
        div.appendChild(why);
        answered++; if (right) correct++;
        if (answered === questions.length) {
          scoreBox.hidden = false;
          scoreBox.innerHTML = `<span class="big-number">${correct}/${questions.length}</span>
            <span>${correct === questions.length ? "Perfect. You own this one." : correct >= questions.length * 0.6 ? "Solid. Reread the explanations for the ones you missed." : "Worth another pass. Read the lesson again, then retry."}</span>
            <button class="btn small" type="button">Retry</button>`;
          $("button", scoreBox).addEventListener("click", () => renderQuiz(container, questions, { title, onFinish }));
          if (onFinish) onFinish(correct, questions.length);
        }
      })
    );
  });
}

    part: 1, title: "Gradient descent", sub: "Walking downhill in the fog",
    body: `
<p>Picture every possible setting of the weights as a spot on a huge landscape. The height at each spot is the loss. Training means finding a low valley.</p>
<p>The catch is that you can't see the landscape. A real network has millions of weights, so this "landscape" has millions of directions. What you <em>can</em> work out is the slope right where you're standing. That slope is called the <strong>gradient</strong>. It tells you which way is uphill and how steep it is.</p>
<p>So you take a small step the other way, downhill. Then you check the slope again and take another step. That's <strong>gradient descent</strong>:</p>
<div class="formula">new weight = old weight − learning rate × slope</div>
<p>The minus sign means "go against the slope". The <strong>learning rate</strong> sets the step size.</p>
<ul>
  <li>Too small and training crawls.</li>
  <li>Too big and you jump right over the valley, bounce around, or fly off the chart.</li>
</ul>
<div data-widget="descent"></div>
<p>This landscape has a deep valley on the left and a shallower one on the right. Start on the right with a small learning rate and you get stuck in the shallow one, called a <strong>local minimum</strong>. Real networks have so many directions that there's usually some way downhill, and in practice getting stuck is less of a problem than you'd expect. Picking a good learning rate matters a lot, though.</p>`,

      { q: "What tends to happen when the learning rate is far too big?", options: ["Training gets perfectly accurate", "Nothing changes", "Steps overshoot the valley, so the loss bounces around or blows up", "The network gets more layers"], answer: 2, why: "Big steps jump right over the low point, sometimes further up the other side each time." },

    part: 1, title: "Backpropagation", sub: "Handing out blame, last layer to first",
    body: `
<p>Gradient descent needs the slope for <em>every</em> weight. A big model has billions of them. Nudging each one separately to see what happens would take forever. <strong>Backpropagation</strong> gets all the slopes in one backward sweep.</p>
<h3>The idea: hand out blame</h3>
<ol>
  <li>Run the forward pass and compare the output with the truth. Say the output was 0.3 too high.</li>
  <li>For the output neuron, a mathematical shortcut (sigmoid paired with cross-entropy) makes its "blame" simply <strong>prediction − truth</strong>.</li>
  <li>Each weight feeding that neuron gets blame equal to <strong>the neuron's blame × the input on that wire</strong>. A wire that carried a big signal had a big effect, so it gets more of the blame. A wire that carried 0 gets none.</li>
  <li>Pass the blame back to the hidden neurons. Each one gets a share depending on how strongly it was connected, times how responsive its activation was at that moment (the activation's slope).</li>
  <li>Repeat, layer by layer, back to the start. Now every weight has its slope.</li>
</ol>
<p>In calculus this is the <strong>chain rule</strong>. You don't need calculus to get the idea, though: blame flows backwards through the same wires the numbers flowed forward through.</p>
<div data-widget="backprop"></div>
<p>This is the core of the real code in <a href="#code">nn.js</a>. The blame is called <code>delta</code>:</p>
<pre class="readout">let delta = [p - y];                          // output blame: prediction − truth
gradW[l][j][i] += delta[j] * prev[i];         // weight blame = neuron blame × its input
newDelta[i] = sum(weights[l][j][i] * delta[j]) * slopeOfActivation;  // pass it back
weight -= learningRate * gradient;            // then step downhill</pre>
<p>Backpropagation was popularised in 1986 by David Rumelhart, Geoffrey Hinton, and Ronald Williams. Hinton later shared the 2018 Turing Award with Yoshua Bengio and Yann LeCun, and the 2024 Nobel Prize in Physics with John Hopfield, for foundational work on neural networks.</p>`,
    meetup: "Backpropagation is how the network works out the gradient for every weight at once. You start with the error at the output and use the chain rule to pass blame backwards, layer by layer. Each weight's share depends on how much signal flowed through it. Then gradient descent nudges every weight. Hinton, Rumelhart and Williams popularised it in 1986.",
    quiz: [
      { q: "What does backpropagation compute?", options: ["The final answer", "The slope of the loss for every weight, which gradient descent then uses", "The learning rate", "The training data"], answer: 1, why: "Backprop produces the gradients. Gradient descent then uses them to update the weights." },
      { q: "Which direction does backpropagation work in?", options: ["From the output back toward the input", "From the input forward to the output", "Random order", "Only the middle layer"], answer: 0, why: "It starts at the error at the output and passes blame backwards, hence the name." },
      { q: "On one example, a weight's input wire carried exactly 0. How much does that weight get adjusted for that example?", options: ["A lot", "None. Weight blame = neuron blame × input, and the input was 0.", "It gets reset to 0", "It doubles"], answer: 1, why: "If nothing flowed through the wire, the weight couldn't have caused the error, so its gradient is 0 for that example." },
    ],

    part: 1, title: "Training for real", sub: "Epochs, test data, and the overfitting trap",
    body: `
<p>Now put it all together. Training loops over these steps:</p>
<ol>
  <li>Take a small handful of examples, called a <strong>mini-batch</strong>. The lab uses 10.</li>
  <li>Run a forward pass on each, and measure the loss.</li>
  <li>Backpropagate to get every weight's gradient, averaged over the batch.</li>
  <li>Take one gradient descent step.</li>
</ol>
<p>One full trip through all the training data is an <strong>epoch</strong>. Small networks train for hundreds or thousands of epochs. Big language models often see each piece of their training text only about once, because there's so much of it.</p>
<h3>Practice exam versus real exam</h3>
<p>If you memorise the answers to a practice exam, you ace the practice and fail the real thing. Networks can do the same. That's called <strong>overfitting</strong>.</p>
<p>So we hold some data back as a <strong>test set</strong>. The network never trains on it, and we only use it to check. In the lab, the hollow dots are test points. If the training loss keeps falling while the test loss climbs, the network is memorising instead of learning.</p>
<h3>Parameters versus hyperparameters</h3>
<ul>
  <li><strong>Parameters</strong> are the weights and biases. The network learns them.</li>
  <li><strong>Hyperparameters</strong> are settings <em>you</em> choose: the number of layers, the number of neurons, the learning rate, the batch size.</li>

    part: 2, title: "Tokens", sub: "How text becomes numbers",
    body: `
<p>A <strong>large language model</strong> (LLM) is a neural network trained on enormous amounts of text. Neural networks only work with numbers, though, so step one is turning text into numbers.</p>
<p>LLMs don't read letter by letter, or even word by word. They read <strong>tokens</strong>: chunks of text, each with an ID number. Common words are usually one token. Rare or long words get split into pieces. In English, one token works out to about ¾ of a word, or roughly 4 characters, on average.</p>
<h3>How the token list is built: Byte Pair Encoding</h3>
<p>GPT models and many others build their vocabulary with an algorithm called <strong>BPE</strong>:</p>
<ol>
  <li>Start with every single character as its own token.</li>
  <li>Find the pair of neighbouring tokens that shows up most often in the training text.</li>
  <li>Glue that pair into one new token, and remember the rule.</li>
  <li>Repeat tens of thousands of times.</li>
</ol>
<p>Below is a real BPE tokenizer, trained live in your browser on a few paragraphs of text. Drag the slider to change how many merges it learns, and type your own text.</p>
<div data-widget="tokenizer"></div>
<h3>Why tokens matter</h3>
<ul>
  <li>LLM usage is <strong>priced and limited in tokens</strong>. A "200,000-token context window" means about 150,000 words.</li>
  <li>The model never sees individual letters, only token IDs. That's why LLMs have famously struggled with questions like "how many r's are in strawberry?". The word reaches the model as a couple of chunks, not as letters.</li>
  <li>Real vocabularies hold roughly 50,000 to 200,000+ tokens and are built from huge amounts of text in many languages.</li>
</ul>`,
    meetup: "LLMs don't see letters or words, they see tokens: chunks of text with ID numbers, about ¾ of a word each in English. The vocabulary is usually built with Byte Pair Encoding, which repeatedly merges the most common pair of pieces. That's why they're bad at counting letters. They literally don't see them.",

    part: 2, title: "Embeddings", sub: "Meaning as a position in space",
    body: `
<p>A token ID like 4,821 is just a label. The number itself means nothing, and token 4,822 isn't "close" to it in meaning. So the first layer of an LLM swaps every token ID for a long list of learned numbers called an <strong>embedding</strong>.</p>
<p>Think of an embedding as coordinates. A point on a map has 2 coordinates. A token's embedding might have thousands. GPT-3's had 12,288.</p>
<p>Nobody sets these numbers by hand. They start random and get trained by backpropagation along with everything else. Because words used in similar ways need to produce similar predictions, they drift close together: <em>dog</em> ends up near <em>puppy</em>, and <em>Edmonton</em> near <em>Calgary</em>. Even <em>directions</em> can carry meaning. A famous 2013 result from Google's word2vec project found that king − man + woman lands near queen.</p>
<div data-widget="embedding"></div>
<p>The tiny language model in the next lesson learns embeddings for each letter, using the same method.</p>
<p>Embeddings also matter outside chatbots. Search engines, recommendation systems, and "chat with your documents" tools (called <strong>RAG</strong>, retrieval-augmented generation) all turn text into embeddings, then find the stored pieces closest in meaning.</p>`,

    part: 2, title: "Predicting the next token", sub: "The one job every LLM is trained for",
    body: `
<p>Here's the surprising core of it. A language model is trained to do exactly one thing: <strong>given some text, predict the next token</strong>.</p>
<p>Its output layer has one neuron per token in the vocabulary. A function called <strong>softmax</strong> turns those outputs into probabilities that add up to 100%. "The weather in Edmonton in January is" might give <em>cold</em> 41%, <em>freezing</em> 18%, <em>brutal</em> 6%, and so on through every token it knows.</p>
<p>To write, the model picks a token from those probabilities, adds it to the text, and runs again. That's why chatbots appear to type one word at a time. They literally write one token at a time.</p>
<p>Training uses everything from Part 1. Take real text, hide the next token, have the model predict it, and score it with cross-entropy loss on the probability it gave the real next token. Then backpropagate and update. Do this over trillions of tokens.</p>
<h3>Train your own language model</h3>
<p>Below is a real character-level language model, written from scratch in <a href="#code">tinylm.js</a>. It reads the last 4 characters and predicts the next one. It has embeddings, one hidden layer of 64 tanh neurons, and a softmax output. It trains on about 1,600 characters of simple sentences. Press Train and watch it go from gibberish to near-English.</p>
<div data-widget="lm"></div>
<p>Notice the starting loss. With 26 possible characters, pure guessing gives −log(1/26) ≈ <strong>3.26</strong>. Everything below that is learned.</p>
<p>This model is tiny. Mostly it memorises its 1,600 characters, so it'll never write a new idea. Scale it up a few billion times, give it the attention mechanism from the next lesson, and train it on a large share of the written internet, and predicting the next token well starts to require knowing grammar, facts, and how arguments work.</p>`,

    part: 2, title: "Attention and Transformers", sub: "Letting every word look at every other word",
    body: `
<p>The tiny model can only see 4 characters back. Real language needs much more. In "The trophy didn't fit in the suitcase because <strong>it</strong> was too big", working out what <em>it</em> means requires looking way back.</p>
<p>In 2017, researchers at Google published <em>Attention Is All You Need</em>, introducing the <strong>Transformer</strong>. Almost every major LLM is built on it. The T in GPT stands for Transformer: Generative Pre-trained Transformer.</p>
<h3>How attention works</h3>
<p>Every token makes three vectors from its embedding, using learned weights:</p>
<ul>
  <li>A <strong>query</strong>: "what am I looking for?"</li>
  <li>A <strong>key</strong>: "what do I have to offer?"</li>
  <li>A <strong>value</strong>: "here's the information I'll pass along."</li>
</ul>
<p>Each token compares its query with every earlier token's key (a dot product). Softmax turns those scores into percentages. Then the token takes a blend of the values, weighted by those percentages. So <em>it</em> can pull in most of its meaning from <em>trophy</em>, and from <em>suitcase</em> if the sentence ends with "too small".</p>
<div data-widget="attention"></div>
<h3>The full Transformer</h3>
<ul>
  <li>Many attention <strong>heads</strong> run side by side, each free to learn a different kind of relationship: grammar, who "it" refers to, nearby words, and so on.</li>
  <li>Each layer is <strong>attention</strong>, where tokens share information, followed by a <strong>feed-forward network</strong> applied to each token on its own. That network is a regular neural net, like the ones in the lab.</li>
  <li>Stack dozens of those layers. GPT-3 had 96 layers with 96 heads each.</li>
  <li>In GPT-style models, each token can only attend to tokens <em>before</em> it, never after. That way it can't cheat by peeking at the word it's meant to predict.</li>
</ul>
<p>Attention also works on all tokens at once instead of reading them one by one, which suits GPUs well. That's a big reason Transformers could scale so far.</p>`,
    meetup: "Transformers, from Google's 2017 paper 'Attention Is All You Need', are the architecture behind nearly all LLMs. The key part is attention: each token makes a query, compares it against every earlier token's key, and takes a weighted blend of their values. That's how 'it' can figure out it means 'the trophy'. Layers alternate attention with feed-forward networks, stacked dozens deep.",

    body: `
<p>A chat assistant like ChatGPT or Claude is built in stages.</p>
<h3>1. Pretraining</h3>
<p>Next-token prediction on an enormous pile of text: web pages, books, code, and more, adding up to trillions of tokens. This is where almost all the compute goes. It can mean thousands of GPUs running for weeks or months, and frontier models are widely reported to cost tens to hundreds of millions of dollars to train.</p>
<p>The result is a <strong>base model</strong>. It's great at continuing text, but it isn't an assistant. Ask it a question and it might just carry on with more questions, like a list it found online.</p>
<h3>2. Fine-tuning</h3>
<p>Next, the model trains on many example conversations showing a helpful assistant answering well. This is called supervised fine-tuning or instruction tuning. It's the same next-token training, just on carefully chosen examples.</p>
<h3>3. Learning from feedback</h3>
<p>People compare pairs of answers and pick the better one. Those choices train a <em>reward model</em> that scores answers, and the LLM is then tuned to earn higher scores. This is <strong>RLHF</strong>, reinforcement learning from human feedback, popularised by OpenAI's InstructGPT work in 2022. Anthropic also developed <em>Constitutional AI</em>, where the model's feedback is guided by a written set of principles.</p>

    part: 2, title: "What LLMs can't do, and why", sub: "Hallucinations, memory, temperature",
    body: `
<p>Knowing how LLMs work also explains where they fail. People at a meetup will respect you for knowing the limits.</p>
<h3>Hallucination</h3>
<p>A model is trained to produce <em>likely-sounding</em> text, not checked facts. It has no built-in database to look things up in. Facts it saw often are usually stored well in its weights. For rare facts, it can produce something that sounds just as confident and is completely made up. Connecting a model to search or to your own documents (RAG) and training it to say "I don't know" both help, but neither removes the problem completely.</p>
<h3>Knowledge cutoff</h3>
<p>The weights were trained on data up to some date. Ask about anything after it, and the model doesn't know unless a tool fetches the information.</p>
<h3>Context window</h3>
<p>The context window is how many tokens the model can see at once: your conversation, any documents, and its own replies. It's the model's working memory. Recent models handle hundreds of thousands of tokens, and some handle a million or more. Nothing carries over between separate chats unless the product adds a memory feature, which saves notes and feeds them back in. The weights never change.</p>
<h3>Temperature: how random the picks are</h3>
<p>When the model picks the next token, <strong>temperature</strong> controls how adventurous it is. Low temperature almost always takes the top choice, which gives safe, repetitive text. High temperature gives unlikely tokens more of a chance, which is more creative and more error-prone. Try it on your trained tiny model:</p>
<div data-widget="temperature"></div>
<h3>"Is it really thinking?"</h3>
<p>This one is genuinely debated, and a good answer admits that. Mechanically, it's next-token prediction. But predicting the next token well across all kinds of text seems to require building internal representations of grammar, facts, and reasoning steps. Researchers in a field called <strong>interpretability</strong> look inside models to find those representations. A fair summary: it's "just" prediction, but prediction at this scale turns out to need a lot of structure inside.</p>`,
    meetup: "LLMs hallucinate because they're trained to produce likely text, not verified facts, and there's no lookup unless you give them tools or documents. They know nothing past their training cutoff, and they only remember what fits in the context window. Temperature controls how random the next-token picks are. Whether that counts as thinking is debated. It's prediction, but prediction at that scale needs a lot of internal structure.",

WIDGETS.neuron = (el, token) => {
  el.className = "widget";
  el.innerHTML = `
    <div class="widget-title">Set one neuron's weights by hand</div>
    <p class="widget-note">The background shows the neuron's answer: teal means "yes, class 1" and rust means "no, class 0". Get every dot on matching colour.</p>
    <div class="two-col">
      <canvas class="plot" aria-label="Neuron decision plot"></canvas>
      <div>
        <div class="seg" role="group" aria-label="Dataset">
          <button type="button" data-ds="blobs" aria-pressed="true">Two groups</button>
          <button type="button" data-ds="xor" aria-pressed="false">Four corners</button>
        </div>
        <div style="margin-top:12px">
          <div class="slider-row"><label for="nw1">w₁</label><input id="nw1" type="range" min="-6" max="6" step="0.1" value="-1.5"><output></output></div>
          <div class="slider-row"><label for="nw2">w₂</label><input id="nw2" type="range" min="-6" max="6" step="0.1" value="1"><output></output></div>
          <div class="slider-row"><label for="nb">bias</label><input id="nb" type="range" min="-3" max="3" step="0.1" value="0.5"><output></output></div>
        </div>
        <div class="readout" style="margin-top:10px"></div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn small primary" type="button" data-act="train">Let the computer learn it</button>
          <button class="btn small" type="button" data-act="reset">Reset</button>
        </div>
        <p class="hint-line" data-hint></p>
      </div>
    </div>`;
  const canvas = $("canvas", el);
  const sliders = { w1: $("#nw1", el), w2: $("#nw2", el), b: $("#nb", el) };
  const readout = $(".readout", el);
  const hint = $("[data-hint]", el);
  let ds = "blobs";
  const net = new NeuralNetwork([2, 1], { seed: 2 });
  const makePts = () => DATASETS[ds].make(60, 0.05, makeRandom(ds === "blobs" ? 11 : 12));
  let pts = makePts();
  let training = false;

  function syncNet() {
    net.weights[0][0][0] = +sliders.w1.value;
    net.weights[0][0][1] = +sliders.w2.value;
    net.biases[0][0] = +sliders.b.value;
  }
  function draw() {
    for (const k in sliders) sliders[k].nextElementSibling.textContent = fmt(+sliders[k].value, 1);
    syncNet();
    drawBoundary(canvas, (x) => net.predict(x), pts);
    const right = Math.round(net.accuracy(pts.map((p) => p.x), pts.map((p) => p.y)) * pts.length);
    const p0 = pts[0];
    const z = net.weights[0][0][0] * p0.x[0] + net.weights[0][0][1] * p0.x[1] + net.biases[0][0];
    readout.textContent =
      `z = ${fmt(+sliders.w1.value, 1)}·x₁ + ${signed(+sliders.w2.value, 1)}·x₂ + ${signed(+sliders.b.value, 1)}\n` +
      `e.g. point (${fmt(p0.x[0])}, ${fmt(p0.x[1])}): z = ${fmt(z)} → sigmoid → ${fmt(sigmoid(z))}\n` +
      `correct: ${right} of ${pts.length}` + (right === pts.length ? "  ✓ perfect" : "");
  }
  for (const k in sliders) sliders[k].addEventListener("input", () => { training = false; draw(); });
  $$("[data-ds]", el).forEach((b) => b.addEventListener("click", () => {
    ds = b.dataset.ds;
    $$("[data-ds]", el).forEach((x) => x.setAttribute("aria-pressed", x === b));
    pts = makePts(); training = false;
    hint.textContent = DATASETS[ds].hint;
    draw();
  }));
  $("[data-act=reset]", el).addEventListener("click", () => {
    training = false; sliders.w1.value = -1.5; sliders.w2.value = 1; sliders.b.value = 0.5; draw();
  });
  $("[data-act=train]", el).addEventListener("click", () => {
    if (training) return;
    training = true;
    const rand = makeRandom(5);
    let epochs = 0;
    const tick = () => {
      if (!training || token !== viewToken) return;
      syncNet();
      for (let k = 0; k < 3; k++) net.trainEpoch(pts.map((p) => p.x), pts.map((p) => p.y), 0.5, 10, rand);
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      sliders.w1.value = clamp(net.weights[0][0][0], -6, 6);
      sliders.w2.value = clamp(net.weights[0][0][1], -6, 6);
      sliders.b.value = clamp(net.biases[0][0], -3, 3);
      draw();
      if (++epochs < 120) requestAnimationFrame(tick);
      else {
        training = false;
        hint.textContent = ds === "xor"
          ? "Gradient descent gave up too. No straight line can solve this. That's the XOR problem."
          : "Gradient descent found weights that split the groups.";
      }
    };
    tick();
  });
  hint.textContent = DATASETS[ds].hint;
  draw();
};

  const svg = $("svg", el), readout = $(".readout", el);
  const sx1 = $("#fx1", el), sx2 = $("#fx2", el);
  const pos = { in: [[50, 55], [50, 155]], hid: [[210, 55], [210, 155]], out: [[370, 105]] };
  function draw() {
    const x = [+sx1.value, +sx2.value];
    sx1.nextElementSibling.textContent = fmt(x[0]); sx2.nextElementSibling.textContent = fmt(x[1]);
    const { activations, zs } = net.forward(x);
    const wire = (a, b, wv) => {
      const col = wv >= 0 ? "var(--pos)" : "var(--neg)";
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 + (a[1] < b[1] ? -6 : a[1] > b[1] ? 6 : -6);
      return `<line x1="${a[0] + 24}" y1="${a[1]}" x2="${b[0] - 24}" y2="${b[1]}" stroke="${col}" stroke-width="${1 + Math.abs(wv) * 1.6}" opacity="0.8"/>

    };
    const node = (p, val, label) => `<circle cx="${p[0]}" cy="${p[1]}" r="24" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>

    let s = "";
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) s += wire(pos.in[i], pos.hid[j], net.weights[0][j][i]);
    for (let i = 0; i < 2; i++) s += wire(pos.hid[i], pos.out[0], net.weights[1][0][i]);
    s += node(pos.in[0], x[0], "x₁") + node(pos.in[1], x[1], "x₂");
    s += node(pos.hid[0], activations[1][0], "h₁ · b " + fmt(net.biases[0][0], 1)) + node(pos.hid[1], activations[1][1], "h₂ · b " + fmt(net.biases[0][1], 1));
    s += node(pos.out[0], activations[2][0], "out · b " + fmt(net.biases[1][0], 1));
    svg.innerHTML = s;
    const h = activations[1];
    const line = (name, w, inputs, inNames, b, z, act, a) =>
      `${name}: z = ${w.map((wv, i) => `(${fmt(wv, 1)} × ${fmt(inputs[i])})`).join(" + ")} + ${signed(b, 1)} = ${fmt(z)}  → ${act} → ${fmt(a)}`;
    readout.textContent =
      line("h₁ ", net.weights[0][0], x, ["x₁", "x₂"], net.biases[0][0], zs[0][0], "tanh", h[0]) + "\n" +
      line("h₂ ", net.weights[0][1], x, ["x₁", "x₂"], net.biases[0][1], zs[0][1], "tanh", h[1]) + "\n" +
      line("out", net.weights[1][0], h, ["h₁", "h₂"], net.biases[1][0], zs[1][0], "sigmoid", activations[2][0]) + "\n\n" +
      `Answer: ${fmt(activations[2][0] * 100, 0)}% chance of class 1`;
  }
  sx1.addEventListener("input", draw); sx2.addEventListener("input", draw);
  draw();
};

// ---- Gradient descent on a 1D landscape -------------------------------
WIDGETS.descent = (el, token) => {
  el.className = "widget";
  el.innerHTML = `
    <div class="widget-title">Roll downhill</div>
    <p class="widget-note">One weight, w. The curve is the loss for each value of w. Tap the curve to drop the ball somewhere new.</p>
    <canvas class="wide" style="cursor:crosshair" aria-label="Loss landscape"></canvas>
    <div class="btn-row" style="margin:10px 0">
      <span class="muted" style="font-size:.9rem">Learning rate:</span>
      <div class="seg" role="group" aria-label="Learning rate">
        <button type="button" data-lr="0.02" aria-pressed="false">0.02</button>
        <button type="button" data-lr="0.1" aria-pressed="true">0.1</button>
        <button type="button" data-lr="0.5" aria-pressed="false">0.5</button>
        <button type="button" data-lr="1.6" aria-pressed="false">1.6</button>
      </div>
    </div>
    <div class="btn-row"><button class="btn small primary" type="button" data-act="step">One step</button><button class="btn small" type="button" data-act="run">Run 30 steps</button><button class="btn small" type="button" data-act="reset">Reset</button></div>
    <div class="readout" style="margin-top:10px"></div>`;
  const f = (w) => 0.02 * w ** 4 - 0.4 * w ** 2 + 0.3 * w + 3;
  const df = (w) => 0.08 * w ** 3 - 0.8 * w + 0.3;
  const canvas = $("canvas", el), readout = $(".readout", el);
  let w = 4.4, lr = 0.1, trail = [], msg = "", steps = 0, running = false;
  function draw() {
    const { ctx, w: W, h: H } = setupCanvas(canvas, 220);
    const C = colors();
    ctx.clearRect(0, 0, W, H);
    const X = (v) => ((v + 5.2) / 10.4) * W, Y = (l) => H - 12 - (l / 6) * (H - 24);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath();
    for (let px = 0; px <= W; px++) { const v = (px / W) * 10.4 - 5.2; px ? ctx.lineTo(px, Y(f(v))) : ctx.moveTo(px, Y(f(v))); }
    ctx.stroke();
    ctx.fillStyle = C.muted; ctx.font = "11px monospace"; ctx.fillText("loss", 4, 12); ctx.fillText("w →", W - 30, H - 2);
    ctx.strokeStyle = C.negHex; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath();
    trail.forEach((v, i) => (i ? ctx.lineTo(X(v), Y(f(v))) : ctx.moveTo(X(v), Y(f(v))))); ctx.stroke(); ctx.setLineDash([]);
    if (Math.abs(w) <= 5.2) { ctx.fillStyle = C.negHex; ctx.beginPath(); ctx.arc(X(w), Y(f(w)), 8, 0, Math.PI * 2); ctx.fill(); }
    const slope = df(w);
    readout.textContent = `step ${steps}   w = ${fmt(w)}   loss = ${fmt(f(w))}   slope = ${fmt(slope)}\n` +
      `next: w = ${fmt(w)} − ${lr} × ${signed(slope)} = ${fmt(w - lr * slope)}` + (msg ? "\n" + msg : "");
  }
  function step() {
    if (Math.abs(w) > 5.2) return;
    trail.push(w);
    w = w - lr * df(w); steps++;
    msg = "";
    if (Math.abs(w) > 5.2) msg = "Overshot right off the chart. That learning rate is far too big. Press Reset.";
    else if (Math.abs(df(w)) < 0.01) msg = w > 0 ? "Settled in the shallow valley (a local minimum). The deeper one is to the left." : "Settled in the deepest valley.";
    draw();
  }
  $$("[data-lr]", el).forEach((b) => b.addEventListener("click", () => {
    lr = +b.dataset.lr; $$("[data-lr]", el).forEach((x) => x.setAttribute("aria-pressed", x === b)); draw();
  }));
  $("[data-act=step]", el).addEventListener("click", step);
  $("[data-act=reset]", el).addEventListener("click", () => { running = false; w = 4.4; trail = []; steps = 0; msg = ""; draw(); });
  $("[data-act=run]", el).addEventListener("click", () => {
    if (running) return; running = true; let n = 0;
    const tick = () => { if (!running || token !== viewToken) return; step(); if (++n < 30 && Math.abs(w) <= 5.2) setTimeout(tick, reducedMotion ? 0 : 90); else running = false; };
    tick();
  });
  canvas.addEventListener("click", (e) => {
    const r = canvas.getBoundingClientRect();
    w = ((e.clientX - r.left) / r.width) * 10.4 - 5.2; trail = []; steps = 0; msg = ""; running = false; draw();
  });
  draw();
};

WIDGETS.backprop = (el) => {
  el.className = "widget";
  el.innerHTML = `
    <div class="widget-title">Watch one neuron learn one example</div>
    <p class="widget-note">Example: inputs x = (1.0, 0.5), and the truth is y = 1. Learning rate 0.5. Each press runs the forward pass, the backward pass, and the update.</p>
    <div class="btn-row"><button class="btn small primary" type="button" data-act="step">Take one training step</button><button class="btn small" type="button" data-act="reset">Reset</button></div>
    <div class="readout" style="margin-top:10px"></div>
    <canvas class="wide" style="margin-top:10px" aria-label="Loss over steps"></canvas>`;
  const x = [1.0, 0.5], y = 1, lr = 0.5;
  let w, b, history, steps;
  const readout = $(".readout", el), canvas = $("canvas", el);
  function reset() { w = [-0.5, 0.3]; b = 0; history = []; steps = 0; render(null); }
  function forward() { const z = w[0] * x[0] + w[1] * x[1] + b; const p = sigmoid(z); return { z, p, loss: -Math.log(p) }; }
  function render(last) {
    const { z, p, loss } = forward();
    let s = `Step ${steps}\n\nFORWARD\n  z = (${fmt(w[0])} × 1.0) + (${fmt(w[1])} × 0.5) + ${signed(b)} = ${fmt(z)}\n  p = sigmoid(${fmt(z)}) = ${fmt(p, 3)}\n  loss = −log(${fmt(p, 3)}) = ${fmt(loss, 3)}`;
    if (last) {
      s += `\n\nBACKWARD (from the previous step)\n  blame at output   = p − y = ${fmt(last.p, 3)} − 1 = ${fmt(last.d, 3)}\n` +
        `  slope for w₁     = blame × x₁ = ${fmt(last.d, 3)} × 1.0 = ${fmt(last.d * 1.0, 3)}\n` +
        `  slope for w₂     = blame × x₂ = ${fmt(last.d, 3)} × 0.5 = ${fmt(last.d * 0.5, 3)}\n` +
        `  slope for bias   = blame      = ${fmt(last.d, 3)}\n\nUPDATE (w = w − 0.5 × slope)\n` +
        `  w₁: ${fmt(last.w[0])} → ${fmt(w[0])}    w₂: ${fmt(last.w[1])} → ${fmt(w[1])}    b: ${fmt(last.b)} → ${fmt(b)}`;
    } else s += "\n\nPress the button to run backprop and update the weights.";
    readout.textContent = s;
    history.push(loss);
    drawLossChart(canvas, [{ data: history, color: colors().negHex }], { height: 90, xLabel: "loss after each step", maxY: Math.max(1.2, history[0] * 1.05) });
  }
  $("[data-act=step]", el).addEventListener("click", () => {
    const { p } = forward();
    const d = p - y;
    const last = { p, d, w: w.slice(), b };
    w = [w[0] - lr * d * x[0], w[1] - lr * d * x[1]]; b = b - lr * d; steps++;
    render(last);
  });
  $("[data-act=reset]", el).addEventListener("click", reset);
  reset();
};

// ---- Tiny language model (shared across lessons) -------------------------
const LM = { model: null, running: false, history: [], ema: null, sample: "", lastEval: null };
function lmModel() {
  if (!LM.model) { LM.model = new TinyLanguageModel(TRAINING_TEXT, { seed: 42 }); LM.lastEval = LM.model.evaluate(); LM.history = [LM.lastEval]; }
  return LM.model;
}
const LM_MAX_STEPS = 150000;
function lmTrainChunk() {
  const m = lmModel();
  const lr = m.steps < 40000 ? 0.05 : m.steps < 90000 ? 0.025 : 0.012;
  const loss = m.train(500, lr);
  LM.ema = LM.ema === null ? loss : LM.ema * 0.85 + loss * 0.15;
  if (m.steps % 5000 === 0) { LM.lastEval = m.evaluate(); LM.history.push(LM.lastEval); }
}

        <div class="legend"><span><span class="swatch" style="background:var(--ink)"></span>train loss</span><span><span class="swatch" style="background:var(--muted)"></span>test loss (dashed)</span></div>
        <p class="hint-line" data-hint></p>
      </section>
    </div>
    <section class="panel" style="margin-top:16px">
      <h3>Forward pass for the marked point</h3>
      <div class="readout" data-inspect>Tap anywhere on the Output board.</div>
    </section>
  </div>`;

  const dsSel = $("#lab-ds", root), actSel = $("#lab-act", root), lrSel = $("#lab-lr", root), noise = $("#lab-noise", root);
  dsSel.value = LAB.dataset; actSel.value = LAB.activation; lrSel.value = String(LAB.lr); noise.value = LAB.noise;
  const playBtn = $("[data-act=play]", root);
  const netCanvas = $("[data-netcanvas]", root), plot = $("[data-plot]", root), lossCanvas = $("[data-loss]", root);
  let boxes = [];

  function renderArch() {
    const a = $("[data-arch]", root);
    a.innerHTML = `<span class="stepper">hidden layers <button type="button" data-l="-1" aria-label="Remove layer">−</button><b>${LAB.hidden.length}</b><button type="button" data-l="1" aria-label="Add layer">+</button></span>` +
      LAB.hidden.map((n, i) => `<span class="stepper">L${i + 1} <button type="button" data-n="${i}" data-d="-1" aria-label="Fewer neurons in layer ${i + 1}">−</button><b>${n}</b><button type="button" data-n="${i}" data-d="1" aria-label="More neurons in layer ${i + 1}">+</button></span>`).join("");
    $$("[data-l]", a).forEach((b) => b.addEventListener("click", () => {
      const d = +b.dataset.l;
      if (d > 0 && LAB.hidden.length < 4) LAB.hidden.push(4);
      if (d < 0 && LAB.hidden.length > 0) LAB.hidden.pop();
      rebuild();
    }));
    $$("[data-n]", a).forEach((b) => b.addEventListener("click", () => {
      const i = +b.dataset.n; LAB.hidden[i] = Math.max(1, Math.min(8, LAB.hidden[i] + +b.dataset.d)); rebuild();
    }));
  }
  function rebuild() { labMakeNet(); renderArch(); draw(); }

  function drawNetwork() {
    const net = LAB.net, sizes = net.sizes, C = colors();
    const maxN = Math.max(...sizes);
    const box = 34, gapY = 12;
    const height = Math.max(150, maxN * (box + gapY) + 24);
    const { ctx, w } = setupCanvas(netCanvas, height);
    ctx.clearRect(0, 0, w, height);
    const cols = sizes.length;
    const colX = (l) => 22 + (l / (cols - 1)) * (w - 44 - box);
    const posOf = (l, j) => [colX(l), (height - sizes[l] * (box + gapY) + gapY) / 2 + j * (box + gapY)];
    // Each neuron's response across the board (small grid).
    const G = 14;
    const maps = sizes.map((n) => Array.from({ length: n }, () => new Float32Array(G * G)));
    for (let gj = 0; gj < G; gj++) for (let gi = 0; gi < G; gi++) {
      const x = [-DOMAIN + (2 * DOMAIN * (gi + 0.5)) / G, DOMAIN - (2 * DOMAIN * (gj + 0.5)) / G];
      const { activations } = net.forward(x);
      activations.forEach((layer, l) => layer.forEach((a, j) => {
        let v;
        if (l === 0) v = a / DOMAIN;
        else if (l === sizes.length - 1 || net.activationName === "sigmoid") v = 2 * a - 1;
        else if (net.activationName === "relu") v = Math.tanh(a);
        else v = a;
        maps[l][j][gj * G + gi] = v;
      }));
    }
    // Wires.
    let maxW = 0.5;
    net.weights.forEach((L) => L.forEach((row) => row.forEach((v) => (maxW = Math.max(maxW, Math.abs(v))))));
    for (let l = 0; l < net.weights.length; l++) {
      for (let j = 0; j < net.weights[l].length; j++) for (let i = 0; i < net.weights[l][j].length; i++) {
        const v = net.weights[l][j][i];
        const [x1, y1] = posOf(l, i), [x2, y2] = posOf(l + 1, j);
        ctx.strokeStyle = v >= 0 ? C.posHex : C.negHex;
        ctx.globalAlpha = 0.25 + 0.75 * Math.min(1, Math.abs(v) / maxW);
        ctx.lineWidth = 0.6 + 4 * Math.min(1, Math.abs(v) / maxW);
        ctx.beginPath(); ctx.moveTo(x1 + box, y1 + box / 2);
        ctx.bezierCurveTo(x1 + box + 30, y1 + box / 2, x2 - 30, y2 + box / 2, x2, y2 + box / 2); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // Neuron thumbnails.
    boxes = [];
    const off = document.createElement("canvas"); off.width = G; off.height = G;
    const octx = off.getContext("2d");
    sizes.forEach((n, l) => {
      for (let j = 0; j < n; j++) {
        const img = octx.createImageData(G, G);
        maps[l][j].forEach((v, k) => { const c = valueColor(v, C, 0.85); img.data.set([c[0], c[1], c[2], 255], k * 4); });
        octx.putImageData(img, 0, 0);
        const [x, y] = posOf(l, j);
        ctx.imageSmoothingEnabled = true; ctx.drawImage(off, x, y, box, box);
        ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, box - 1, box - 1);
        boxes.push({ l, j, x, y });
      }
    });
    ctx.fillStyle = C.muted; ctx.font = "11px monospace"; ctx.textAlign = "center";
    ctx.fillText("x₁", posOf(0, 0)[0] + box / 2, posOf(0, 0)[1] - 4);
    ctx.fillText("x₂", posOf(0, 1)[0] + box / 2, posOf(0, 1)[1] + box + 12);
    ctx.fillText("output", posOf(cols - 1, 0)[0] + box / 2, posOf(cols - 1, 0)[1] + box + 12);
    ctx.textAlign = "start";
  }

  function draw() {
    const net = LAB.net;
    drawBoundary(plot, (x) => net.predict(x), [...LAB.train, ...LAB.test], { marker: LAB.marker });
    drawNetwork();
    const h = LAB.history;
    const trX = LAB.train.map((p) => p.x), trY = LAB.train.map((p) => p.y), teX = LAB.test.map((p) => p.x), teY = LAB.test.map((p) => p.y);
    $("[data-s=epoch]", root).textContent = LAB.epoch;
    $("[data-s=trl]", root).textContent = fmt(h.train[h.train.length - 1], 3);
    $("[data-s=tel]", root).textContent = fmt(h.test[h.test.length - 1], 3);
    $("[data-s=tra]", root).textContent = fmt(net.accuracy(trX, trY) * 100, 0) + "%";
    $("[data-s=tea]", root).textContent = fmt(net.accuracy(teX, teY) * 100, 0) + "%";
    $("[data-s=params]", root).textContent = net.parameterCount();
    const C = colors();
    drawLossChart(lossCanvas, [{ data: h.train, color: C.ink }, { data: h.test, color: C.muted, dash: [5, 4] }], { height: 110, xLabel: "epochs →" });
    $("[data-hint]", root).textContent = DATASETS[LAB.dataset].hint;
    $("[data-noise]", root).textContent = fmt(LAB.noise, 2);
    playBtn.textContent = LAB.playing ? "Pause" : "Train";
    if (LAB.marker) inspect();
  }

  function inspect() {
    const net = LAB.net, x = LAB.marker;
    const { activations, zs } = net.forward(x);
    const act = net.activationName;
    let s = `Point (x₁ = ${fmt(x[0])}, x₂ = ${fmt(x[1])})\n`;
    for (let l = 0; l < net.weights.length; l++) {
      const last = l === net.weights.length - 1;
      s += `\n${last ? "Output" : "Hidden layer " + (l + 1)}  (each: z = sum of weight × input + bias, then ${last ? "sigmoid" : act})\n`;
      const inNames = l === 0 ? ["x₁", "x₂"] : activations[l].map((_, i) => `h${l}.${i + 1}`);
      net.weights[l].forEach((row, j) => {
        const terms = row.map((wv, i) => `${fmt(wv)}×${fmt(activations[l][i])}`).join(" + ");
        s += `  ${last ? "out " : `h${l + 1}.${j + 1}`}: ${terms} + ${signed(net.biases[l][j])} = ${fmt(zs[l][j])} → ${fmt(activations[l + 1][j], 3)}\n`;
      });
    }
    const p = activations[activations.length - 1][0];
    s += `\nAnswer: ${fmt(p * 100, 1)}% chance of class 1 → predicts ${p >= 0.5 ? "class 1 (teal)" : "class 0 (rust)"}`;
    $("[data-inspect]", root).textContent = s;
  }

  function loop() {
    if (!LAB.playing || token !== viewToken) { LAB.playing = false; return; }
    const trX = LAB.train.map((p) => p.x), trY = LAB.train.map((p) => p.y);
    LAB.net.trainEpoch(trX, trY, LAB.lr, 10, LAB.rand);
    LAB.epoch++;
    labRecord();
    draw();
    if (LAB.epoch >= 5000) { LAB.playing = false; draw(); return; }
    requestAnimationFrame(loop);
  }

  playBtn.addEventListener("click", () => { LAB.playing = !LAB.playing; draw(); if (LAB.playing) loop(); });
  $("[data-act=step]", root).addEventListener("click", () => {
    LAB.playing = false;
    LAB.net.trainEpoch(LAB.train.map((p) => p.x), LAB.train.map((p) => p.y), LAB.lr, 10, LAB.rand);
    LAB.epoch++; labRecord(); draw();
  });
  $("[data-act=reset]", root).addEventListener("click", () => { LAB.playing = false; rebuild(); });
  dsSel.addEventListener("change", () => { LAB.dataset = dsSel.value; LAB.playing = false; labMakeData(); rebuild(); });
  actSel.addEventListener("change", () => { LAB.activation = actSel.value; LAB.playing = false; rebuild(); });
  lrSel.addEventListener("change", () => { LAB.lr = +lrSel.value; draw(); });
  noise.addEventListener("input", () => { LAB.noise = +noise.value; LAB.playing = false; labMakeData(); rebuild(); });
  plot.addEventListener("click", (e) => {
    const r = plot.getBoundingClientRect();
    LAB.marker = [fromPx(e.clientX - r.left, r.width), -fromPx(e.clientY - r.top, r.height)];
    draw();
  });
  netCanvas.addEventListener("click", (e) => {
    const r = netCanvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const hit = boxes.find((b) => mx >= b.x - 4 && mx <= b.x + 38 && my >= b.y - 4 && my <= b.y + 38);
    const info = $("[data-ninfo]", root);
    if (!hit) return;
    if (hit.l === 0) { info.textContent = `Input ${hit.j === 0 ? "x₁ (left–right position)" : "x₂ (up–down position)"}. Inputs have no weights. They're just the data.`; return; }
    const W = LAB.net.weights[hit.l - 1][hit.j], b = LAB.net.biases[hit.l - 1][hit.j];
    const name = hit.l === LAB.net.sizes.length - 1 ? "Output neuron" : `Layer ${hit.l}, neuron ${hit.j + 1}`;
    info.textContent = `${name}: weights in [${W.map((v) => fmt(v)).join(", ")}], bias ${fmt(b)}`;
  });
  window.addEventListener("resize", () => { if (token === viewToken) draw(); });

  renderArch();
  draw();
  if (LAB.playing) loop();
}

function renderCheatSheet(root) {
  const qa = [
    ["What's a neural network, in one breath?", "A big math function with lots of adjustable numbers called weights. You show it examples with the right answers, measure how wrong it is with a loss, and use gradient descent to nudge every weight to be a little less wrong. After millions of nudges, the weights hold the patterns. Nobody writes the rules."],
    ["How does it actually learn?", "Forward pass to get a prediction, a loss to score it, backpropagation to work out how each weight affected the error (the chain rule, run backwards through the layers), then gradient descent to step each weight downhill. Repeat over mini-batches for many epochs."],
    ["What's an LLM?", "A large language model: a Transformer neural network trained to predict the next token on trillions of tokens of text. To write, it predicts a token, appends it, and repeats. Chat assistants are that base model plus fine-tuning on example conversations and feedback training like RLHF."],
    ["What is attention / a Transformer?", "The architecture from Google's 2017 paper 'Attention Is All You Need'. In attention, each token makes a query, compares it with every earlier token's key, and takes a weighted blend of their values. That lets words pull in context from anywhere earlier in the text. Layers alternate attention with feed-forward networks, stacked dozens deep, and it all runs in parallel on GPUs."],
    ["What are parameters?", "The learned numbers: weights and biases. GPT-3 had 175 billion. Most frontier labs don't publish their counts now. My little lab network had 37."],
    ["What are tokens and embeddings?", "Tokens are chunks of text, about ¾ of a word each, usually built with Byte Pair Encoding. Each token ID gets swapped for an embedding, a long learned vector where similar meanings sit close together."],
    ["Why do LLMs hallucinate?", "They're trained to produce likely text, not verified facts, and they have no built-in database. Rare facts get blurry, and the model fills the gap with something plausible. Retrieval (RAG), tools, and training for calibrated answers help, but don't remove it."],
    ["Does ChatGPT learn from my chats?", "Not while you're chatting. That's inference, and the weights are frozen. Memory features save notes and put them back into the context window. Companies may use conversations in future training runs depending on their policies and your settings, but that's a separate, later process."],
    ["Why GPUs?", "Neural networks are mostly enormous amounts of multiply-and-add, specifically matrix multiplication. GPUs do thousands of those in parallel. Deep learning took off around 2012, when AlexNet was trained on GPUs and won the ImageNet image-recognition competition by a big margin."],
    ["Is it really thinking?", "Honestly, that's debated. Mechanically it's next-token prediction. But predicting text well at scale seems to require internal representations of facts and reasoning, and interpretability researchers study those. I'd say it's 'just prediction', but prediction that needs a lot of structure inside."],
  ];
  const glossary = [
    ["Neuron", "Weighted sum of inputs plus a bias, passed through an activation function."],
    ["Weight", "A learned number on a connection. Says how much, and which way, an input matters."],
    ["Bias", "A learned number added to a neuron's sum. Its default lean."],
    ["Activation function", "The bend after the sum (sigmoid, tanh, ReLU). Without it, depth is pointless."],
    ["Layer", "A group of neurons. Input, hidden, output."],
    ["Forward pass", "Running an input through the network to get an output."],
    ["Loss", "One number for how wrong the network is. Training lowers it."],
    ["Cross-entropy", "Loss = −log(probability given to the correct answer)."],
    ["Gradient", "The slope of the loss with respect to each weight."],
    ["Gradient descent", "Repeatedly stepping weights against the gradient, downhill."],
    ["Learning rate", "Step size for gradient descent."],
    ["Backpropagation", "Computing all the gradients by passing blame backwards with the chain rule."],
    ["Epoch", "One full pass over the training data."],
    ["Mini-batch", "A small group of examples used for one update."],
    ["Overfitting", "Memorising the training data. Good training scores, bad test scores."],
    ["Parameters / hyperparameters", "Learned numbers / settings people choose."],
    ["Inference", "Using a trained model. Weights frozen."],
    ["Token", "A chunk of text with an ID. About ¾ of an English word."],
    ["BPE", "Byte Pair Encoding. Builds a token vocabulary by merging frequent pairs."],
    ["Embedding", "A learned vector for a token. Nearby means similar."],
    ["Softmax", "Turns a list of scores into probabilities that sum to 1."],
    ["Attention", "Each token blends information from other tokens, weighted by query–key match."],
    ["Transformer", "Architecture of stacked attention and feed-forward layers. The T in GPT."],
    ["Context window", "How many tokens the model can see at once."],
    ["Temperature", "How random the next-token sampling is."],
    ["Pretraining", "Next-token training on massive text. Produces a base model."],
    ["Fine-tuning", "Further training on chosen examples, such as assistant conversations."],
    ["RLHF", "Reinforcement learning from human feedback. Tunes toward answers people prefer."],
    ["RAG", "Retrieval-augmented generation. Fetch relevant documents and put them in the context."],
    ["Hallucination", "Confident output that isn't true."],
  ];
  const numbers = [
    ["1943", "McCulloch & Pitts' math model of a neuron"], ["1958", "Rosenblatt's perceptron"], ["1969", "Minsky & Papert's Perceptrons shows one layer can't do XOR"],
    ["1986", "Rumelhart, Hinton & Williams popularise backpropagation"], ["2012", "AlexNet, trained on GPUs, wins ImageNet. Deep learning takes off"], ["2013", "word2vec embeddings (king − man + woman ≈ queen)"],
    ["2017", "'Attention Is All You Need' introduces the Transformer"], ["2020", "GPT-3: 175 billion parameters"], ["Nov 2022", "ChatGPT launches"],
    ["2024", "Hinton and Hopfield win the Nobel Prize in Physics for neural network foundations"],
  ];
  root.innerHTML = `<div class="read">
    <div class="eyebrow">Meetup cheat sheet</div>
    <h1>Hold your own in the conversation</h1>
    <p class="lede" style="margin-top:8px">Short, accurate answers you can say out loud. Read them until you can say them without looking.</p>
    <aside class="meetup"><span class="tag">When someone asks what you've been working on</span>
      <p>"I built a small neural network from scratch in JavaScript, no libraries, to really understand how they learn. It does the forward pass, cross-entropy loss, backpropagation and gradient descent, and you can watch it learn shapes live. I also built a tiny character-level language model that learns to write from about 1,600 characters of text, plus a BPE tokenizer. Same core ideas as GPT, just about 40 million times smaller than GPT-3."</p></aside>
    <h2 style="margin-top:32px">Questions you'll get</h2>
    <div class="qa">${qa.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</div>
    <h2>Dates worth knowing</h2>
    <div class="table-scroll" style="margin-top:12px"><table class="data">${numbers.map(([y, t]) => `<tr><td class="num">${y}</td><td>${t}</td></tr>`).join("")}</table></div>
    <h2 style="margin-top:32px">Glossary</h2>
    <dl class="glossary">${glossary.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join("")}</dl>
  </div>`;
}

    <div class="eyebrow">Read the code</div>
    <h1>Everything, from scratch</h1>
    <p class="lede" style="margin-top:8px">No AI libraries. Start with <b>nn.js</b>. The comments walk you through every step. If you're learning JavaScript on freeCodeCamp, all of this is code you can read.</p>
    <div class="seg" role="group" aria-label="File" style="margin:16px 0">${files.map((f, i) => `<button type="button" data-file="${f}" aria-pressed="${i === 0}">${f}</button>`).join("")}</div>
    <pre class="code-view" data-code>Loading…</pre>
  </div>`;
  const show = async (f) => {
    $$("[data-file]", root).forEach((b) => b.setAttribute("aria-pressed", b.dataset.file === f));
    const pre = $("[data-code]", root);
    try {
      const res = await fetch(f);
      if (!res.ok) throw new Error(res.status);
      const text = await res.text();
      pre.innerHTML = escapeHtml(text).split("\n").map((line) => {
        const i = line.indexOf("//");
        return i >= 0 && !line.slice(0, i).includes('"') ? line.slice(0, i) + `<span class="c">${line.slice(i)}</span>` : line;
      }).join("\n");
    } catch (e) {
      pre.textContent = `Couldn't load ${f} here. If you opened this page as a file on your computer, open ${f} from the same folder in any text editor.`;
    }
  };
  $$("[data-file]", root).forEach((b) => b.addEventListener("click", () => show(b.dataset.file)));
  show(files[0]);
}

// =====================================================================
//  Router
// =====================================================================
function route() {
  const token = ++viewToken;
  LAB.playing = false;
  const name = (location.hash || "#home").slice(1) || "home";
  const root = $("#view");
  const m = name.match(/^lesson-(\d+)$/);
  let nav = name;
  if (m && +m[1] >= 1 && +m[1] <= LESSONS.length) { renderLesson(root, +m[1], token); nav = "home"; }
  else if (name === "lab") renderLab(root, token);
  else if (name === "cheat-sheet") renderCheatSheet(root);
  else if (name === "final-test") renderFinal(root);
  else if (name === "code") renderCode(root);
  else { renderHome(root, token); nav = "home"; }
  $$("[data-nav]").forEach((a) => (a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
